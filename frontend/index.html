  <script>
    /* Áp dụng giao diện sáng/tối trước khi React tải để tránh nháy màn hình */
    (function () { try { var t = localStorage.getItem('utc_theme') || 'auto';
      var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); } catch (e) {} })();
  </script>
